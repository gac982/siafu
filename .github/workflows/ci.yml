name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true
      - run: go mod download
      - name: check
        run: |
          set +e
          set -o pipefail
          make check 2>&1 | tee /tmp/check.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            grep -E '^(--- FAIL|FAIL|# |panic:|gofmt needed|vet:)|_test\.go:[0-9]+:' /tmp/check.log | head -20 | while IFS= read -r line; do
              echo "::error title=make check::$line"
            done
          fi
          exit "$status"
      - run: make e2e
      - run: make build
      - name: cross compile
        if: matrix.os == 'ubuntu-latest'
        run: make build-all
